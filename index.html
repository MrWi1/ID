<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
宸星电竞 ID 查询系统
</title>


<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

}



body{

font-family:

"Microsoft YaHei",
Arial,
sans-serif;

background:#f3f5f8;

color:#333;

padding:20px;


}



.container{

max-width:1100px;

margin:auto;

}



.header{

text-align:center;

margin-bottom:25px;

}



.header h1{

font-size:30px;

color:#243447;

}



.header p{

color:#888;

margin-top:8px;

}




.card{

background:#fff;

border-radius:15px;

padding:20px;

margin-bottom:20px;

box-shadow:

0 5px 20px rgba(0,0,0,.08);


}





.search-box{

display:flex;

gap:10px;

}



.search-box input{

flex:1;

height:45px;

border:

1px solid #ddd;

border-radius:8px;

padding:0 15px;

font-size:16px;

}





button{

height:40px;

padding:0 18px;

border:none;

border-radius:8px;

cursor:pointer;

color:#fff;

background:#4285f4;

}



button:hover{

opacity:.85;

}



.clear{

background:#e74c3c;

}




.tabs{

display:flex;

flex-wrap:wrap;

gap:10px;

}



.tab{

padding:8px 20px;

border-radius:20px;

border:1px solid #ddd;

background:#fff;

cursor:pointer;

}



.tab.active{

background:#4285f4;

color:white;

border-color:#4285f4;

}





.count{

margin-bottom:15px;

color:#666;

}




table{

width:100%;

border-collapse:collapse;

}




th{

background:#f1f3f6;

height:45px;

}



td{

height:50px;

text-align:center;

border-bottom:

1px solid #eee;

}





.tag{

padding:5px 12px;

border-radius:20px;

color:white;

font-size:13px;

}



.明星{

background:#f39c12;

}


.星神{

background:#8e44ad;

}


.星尊{

background:#2980b9;

}


.颜值{

background:#e84393;

}


.星魁{

background:#16a085;

}





.copy-btn{

background:#27ae60;

height:35px;

}





mark{

background:#ffe066;

padding:2px;

}




.toast{

position:fixed;

bottom:30px;

left:50%;

transform:translateX(-50%);

background:#333;

color:#fff;

padding:12px 25px;

border-radius:8px;

opacity:0;

transition:.3s;

}



.toast.show{

opacity:1;

}




@media(max-width:600px){


.search-box{

flex-direction:column;

}



table{

font-size:14px;

}


}


</style>


</head>


<body>


<div class="container">



<div class="header">

<h1>
⭐ 宸星电竞 ID 查询系统
</h1>

<p>
支持名称 / ID / 分类模糊搜索
</p>

</div>





<div class="card">


<div class="search-box">


<input

id="keyword"

placeholder="输入名称、ID、分类搜索"

oninput="searchData()"

onkeydown="if(event.key==='Enter')searchData()"


>


<button

class="clear"

onclick="clearSearch()">

清除

</button>


</div>


</div>





<div class="card">


<div class="tabs">


<div class="tab active"

onclick="changeCategory('全部',this)">

全部

</div>



<div class="tab"

onclick="changeCategory('明星',this)">

明星

</div>



<div class="tab"

onclick="changeCategory('星神',this)">

星神

</div>



<div class="tab"

onclick="changeCategory('星尊',this)">

星尊

</div>



<div class="tab"

onclick="changeCategory('颜值',this)">

颜值

</div>



<div class="tab"

onclick="changeCategory('星魁',this)">

星魁

</div>



</div>


</div>





<div class="card">


<div id="count"

class="count">

</div>


<table>


<thead>


<tr>

<th>
分类
</th>


<th>
名称
</th>


<th>
ID
</th>


<th>
操作
</th>


</tr>


</thead>



<tbody id="list">


</tbody>



</table>



</div>





</div>



<div id="toast"

class="toast">

</div>
<script>


// ==========================
// 全局数据
// ==========================


let DATA = [];


// 当前分类

let currentCategory = "全部";


// 当前搜索关键词

let keyword = "";





// ==========================
// 读取 data.json
// ==========================


async function loadData(){


    try{


        let response =
        await fetch("./data.json");


        DATA =
        await response.json();


        render();


    }

    catch(error){


        console.error(error);


        showToast(
            "数据加载失败，请检查data.json"
        );


    }


}





// ==========================
// 渲染数据
// ==========================


function render(){



    let key =
    keyword
    .toLowerCase()
    .trim();




    let result =
    DATA.filter(item=>{


        let categoryMatch =

        currentCategory==="全部"

        ||

        item.category===currentCategory;



        let searchMatch =


        key===""

        ||


        item.category

        .toLowerCase()

        .includes(key)


        ||


        item.name

        .toLowerCase()

        .includes(key)



        ||


        String(item.id)

        .toLowerCase()

        .includes(key);



        return categoryMatch && searchMatch;



    });






    document

    .getElementById("count")

    .innerHTML =

    `当前显示：

    <b>${result.length}</b>

    条，

    总数据：

    <b>${DATA.length}</b>

    条`;






    let html = "";




    if(result.length===0){



        html=

        `

        <tr>

        <td colspan="4">

        暂无匹配数据

        </td>

        </tr>

        `;


    }



    else{


        result.forEach(item=>{


            html +=


            `

            <tr>


            <td>


            <span class="tag ${item.category}">

            ${item.category}

            </span>


            </td>



            <td>

            ${highlight(item.name)}

            </td>



            <td>

            ${highlight(item.id)}

            </td>



            <td>


            <button

            class="copy-btn"

            onclick="copyID('${item.id}')">


            复制ID


            </button>



            </td>



            </tr>


            `;


        });



    }




    document

    .getElementById("list")

    .innerHTML = html;



}






// ==========================
// 搜索高亮
// ==========================


function highlight(text){


    if(!keyword){

        return text;

    }



    let reg =

    new RegExp(

        keyword,

        "gi"

    );



    return String(text)

    .replace(

        reg,

        match=>

        `<mark>${match}</mark>`

    );


}






// ==========================
// 分类切换
// ==========================


function changeCategory(category,obj){



    currentCategory = category;



    document

    .querySelectorAll(".tab")

    .forEach(tab=>{


        tab.classList.remove(
            "active"
        );


    });



    obj.classList.add(
        "active"
    );



    render();



}






// ==========================
// 搜索
// ==========================


function searchData(){



    keyword =

    document

    .getElementById("keyword")

    .value;



    render();



}






// ==========================
// 清除
// ==========================


function clearSearch(){



    keyword="";



    document

    .getElementById("keyword")

    .value="";



    render();


}






// ==========================
// 复制ID
// ==========================


function copyID(id){



    navigator.clipboard

    .writeText(id)


    .then(()=>{


        showToast(

        "✓ 已复制："+id

        );


    });



}






// ==========================
// 提示框
// ==========================


function showToast(text){



    let toast =

    document

    .getElementById("toast");



    toast.innerHTML=text;



    toast.classList.add(
        "show"
    );



    setTimeout(()=>{


        toast.classList.remove(
            "show"
        );



    },1500);



}






// ==========================
// 启动
// ==========================


loadData();



</script>


</body>

</html>
