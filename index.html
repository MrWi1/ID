<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
宸星电竞ID 搜索
</title>


<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}


body{

font-family:
"Microsoft YaHei",
Arial,
sans-serif;

background:#f5f7fb;

color:#333;

padding:20px;

}


.container{

max-width:1000px;

margin:auto;

}



.title{

text-align:center;

font-size:28px;

font-weight:bold;

margin-bottom:20px;

color:#34495e;

}




.card{

background:white;

border-radius:15px;

padding:20px;

margin-bottom:20px;

box-shadow:
0 5px 20px rgba(0,0,0,.08);

}




.search{

display:flex;

gap:10px;

}



input,
select{

height:42px;

border:1px solid #ddd;

border-radius:8px;

padding:0 12px;

font-size:15px;

}



.search input{

flex:1;

}



button{

border:none;

border-radius:8px;

padding:0 18px;

height:42px;

cursor:pointer;

color:white;

font-size:15px;

}



.btn-blue{

background:#4d8cff;

}



.btn-red{

background:#e74c3c;

}



.btn-green{

background:#27ae60;

}



.tabs{

display:flex;

gap:10px;

flex-wrap:wrap;

}



.tab{

background:#fff;

border:1px solid #ddd;

padding:8px 20px;

border-radius:20px;

cursor:pointer;

}



.tab.active{

background:#4d8cff;

color:white;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#f0f3f8;

height:45px;

}



td{

height:45px;

border-bottom:1px solid #eee;

text-align:center;

}



.tag{

padding:5px 12px;

border-radius:20px;

color:white;

font-size:13px;

}



.明星{

background:#f39c12;

}


.星神{

background:#8e44ad;

}


.星尊{

background:#2980b9;

}


.颜值{

background:#e84393;

}


.星魁{

background:#16a085;

}



.copy{

background:#4d8cff;

}



.admin{

display:none;

}


.toast{

position:fixed;

bottom:30px;

left:50%;

transform:translateX(-50%);

background:#333;

color:white;

padding:12px 25px;

border-radius:8px;

opacity:0;

transition:.3s;

}


.toast.show{

opacity:1;

}



@media(max-width:600px){


.search{

flex-direction:column;

}


table{

font-size:14px;

}



}

</style>


</head>


<body>


<div class="container">


<div class="title">

⭐ 明星与星神 ID 搜索

</div>



<div class="card search">


<input
id="keyword"
placeholder="输入名称或ID搜索">


<button
class="btn-blue"
onclick="searchData()">

搜索

</button>


<button
class="btn-red"
onclick="clearSearch()">

清除

</button>


</div>




<div class="card">


<div class="tabs">


<div class="tab active"
onclick="changeCategory('全部',this)">
全部
</div>


<div class="tab"
onclick="changeCategory('明星',this)">
明星
</div>


<div class="tab"
onclick="changeCategory('星神',this)">
星神
</div>


<div class="tab"
onclick="changeCategory('星尊',this)">
星尊
</div>


<div class="tab"
onclick="changeCategory('颜值',this)">
颜值
</div>


<div class="tab"
onclick="changeCategory('星魁',this)">
星魁
</div>


</div>


</div>



<div class="card">


<table>


<thead>

<tr>

<th>
分类
</th>

<th>
名称
</th>

<th>
ID
</th>

<th>
操作
</th>

</tr>

</thead>


<tbody id="list">


</tbody>


</table>


</div>



<div class="toast" id="toast">

</div>


</div>

 <script>


// ==============================
// 全局变量
// ==============================


let DATA = [];


let currentCategory = "全部";


let keyword = "";




// ==============================
// 加载 data.json
// ==============================


async function loadData(){


    try{


        let res = await fetch("./data.json");


        DATA = await res.json();


        render();


    }catch(e){


        showToast(
            "data.json加载失败"
        );


        console.error(e);


    }


}



// ==============================
// 渲染列表
// ==============================


function render(){



    let result = DATA.filter(item=>{


        let categoryOK =
        currentCategory==="全部"
        ||
        item.category===currentCategory;



        let keywordOK =
        keyword===""

        ||

        item.name
        .toLowerCase()
        .includes(
            keyword.toLowerCase()
        )

        ||

        item.id
        .includes(keyword);



        return categoryOK && keywordOK;


    });



    let html="";



    result.forEach(item=>{


        html += `

        <tr>


        <td>


        <span class="tag ${item.category}">

        ${item.category}

        </span>


        </td>



        <td>

        ${item.name}

        </td>



        <td>

        ${item.id}

        </td>



        <td>


        <button

        class="copy"

        onclick="copyID('${item.id}')">

        复制ID

        </button>


        </td>


        </tr>


        `;



    });



    document
    .getElementById("list")
    .innerHTML=html;



}




// ==============================
// 分类切换
// ==============================


function changeCategory(category,obj){



    currentCategory=category;



    document
    .querySelectorAll(".tab")
    .forEach(
        x=>
        x.classList.remove("active")
    );



    obj.classList.add("active");



    render();


}





// ==============================
// 搜索
// ==============================


function searchData(){


    keyword =
    document
    .getElementById("keyword")
    .value
    .trim();



    render();


}




function clearSearch(){



    keyword="";


    document
    .getElementById("keyword")
    .value="";


    render();


}




// ==============================
// 复制ID
// ==============================


function copyID(id){



    navigator.clipboard
    .writeText(id)
    .then(()=>{


        showToast(
            "复制成功："+id
        );


    });



}




// ==============================
// 提示
// ==============================


function showToast(msg){


    let box =
    document.getElementById("toast");


    box.innerHTML=msg;


    box.classList.add("show");



    setTimeout(()=>{


        box.classList.remove("show");


    },2000);



}



// ==============================
// 初始化
// ==============================


loadData();


</script>
