<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宸星电竞ID</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #2c3e50;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 26px; font-weight: 700; color: #34495e; letter-spacing: 1px; }

  /* 搜索区 */
  .search-box {
    background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-bottom: 24px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .search-box input[type="text"] {
    flex: 1; min-width: 240px; padding: 12px 16px;
    border: 1px solid #dfe4ea; border-radius: 8px; font-size: 15px;
    outline: none; transition: border .2s;
  }
  .search-box input[type="text"]:focus { border-color: #5b8def; }
  .btn {
    padding: 11px 18px; border: none; border-radius: 8px; font-size: 14px;
    cursor: pointer; transition: opacity .2s, transform .1s; color: #fff; font-weight: 500;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: #5b8def; }
  .btn-primary:hover { opacity: .9; }
  .btn-success { background: #27ae60; }
  .btn-success:hover { opacity: .9; }
  .btn-danger  { background: #e74c3c; }
  .btn-danger:hover { opacity: .9; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }

  /* 添加表单 */
  .add-form {
    background: #fff; border-radius: 12px; padding: 18px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05); margin-bottom: 24px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .add-form input, .add-form select {
    padding: 10px 14px; border: 1px solid #dfe4ea; border-radius: 8px; font-size: 14px; outline: none;
  }
  .add-form input:focus, .add-form select:focus { border-color: #5b8def; }
  .add-form input.name-input { flex: 1; min-width: 180px; }
  .add-form input.id-input  { width: 160px; }

  /* 分类标签 */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab {
    padding: 8px 16px; border-radius: 20px; background: #fff;
    border: 1px solid #dfe4ea; cursor: pointer; font-size: 14px;
    transition: all .2s; user-select: none;
  }
  .tab.active { background: #5b8def; color: #fff; border-color: #5b8def; }
  .tab:hover:not(.active) { background: #eef2ff; }
  .tab .num { font-size: 11px; opacity: .8; margin-left: 4px; }

  /* 表格 */
  .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #f0f3f8; text-align: left; padding: 14px 16px; font-size: 14px;
    color: #555; font-weight: 600; border-bottom: 1px solid #eaedf2;
    position: sticky; top: 0; z-index: 1;
  }
  tbody td { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #f2f4f7; }
  tbody tr:hover { background: #f8faff; }
  tbody tr:last-child td { border-bottom: none; }
  .cat-tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; color: #fff; }
  .cat-明星 { background: #f39c12; }
  .cat-星神 { background: #8e44ad; }
  .cat-星尊 { background: #2980b9; }
  .cat-颜值 { background: #e84393; }
  .cat-星魁 { background: #16a085; }

  .id-cell { font-family: "SF Mono", Menlo, Consolas, monospace; color: #34495e; }
  .actions { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; white-space: nowrap; }
  .actions .btn { flex: 0 0 auto; }
  .empty { text-align: center; padding: 40px; color: #999; font-size: 14px; }

  .edit-row input, .edit-row select { padding: 7px 10px; border: 1px solid #dfe4ea; border-radius: 6px; font-size: 13px; width: 100%; }
  .edit-row select { width: auto; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #323232; color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .3s; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .count { font-size: 13px; color: #888; margin-bottom: 8px; }
  .badge-new { animation: flash 1.6s ease; }
  @keyframes flash { 0% { background: #fff7d6; } 100% { background: transparent; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌟 宸星电竞ID</h1>
  </header>

  <!-- 搜索栏 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 输入名称或 ID ">
    <button class="btn btn-primary" id="btnSearch">搜索</button>
    <button class="btn btn-danger" id="btnClear">清除</button>
  </div>

  <!-- 添加新条目 -->
  <div class="add-form">
    <select id="addCat">
      <option value="明星">明星</option>
      <option value="星神">星神</option>
      <option value="星尊">星尊</option>
      <option value="颜值">颜值</option>
      <option value="星魁">星魁</option>
    </select>
    <input class="name-input" id="addName" placeholder="名称（如：小七）">
    <input class="id-input" id="addId" placeholder="ID">
    <button class="btn btn-success" id="btnAdd">+ 添加</button>
  </div>

  <!-- 分类标签（无"全部"，仅五个分类） -->
  <div class="tabs" id="tabs">
    <div class="tab" data-cat="明星">明星<span class="num" id="num-明星"></span></div>
    <div class="tab" data-cat="星神">星神<span class="num" id="num-星神"></span></div>
    <div class="tab" data-cat="星尊">星尊<span class="num" id="num-星尊"></span></div>
    <div class="tab" data-cat="颜值">颜值<span class="num" id="num-颜值"></span></div>
    <div class="tab" data-cat="星魁">星魁<span class="num" id="num-星魁"></span></div>
  </div>
  <div class="count" id="count"></div>

  <!-- 分类表格 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:110px;">分类</th>
          <th>名称</th>
          <th style="width:160px;">ID</th>
          <th style="width:200px;">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 初始数据（首次加载写入 localStorage） ============ */
const INITIAL = [
  ["明星","Cxz明星-小七","81714906"],["明星","Cxg明星-阿亮","81681876"],["明星","Cxg明星-拖鞋","81682896"],
  ["明星","Cxg明星-龙龙","81412078"],["明星","Cxg明星-克制","81682238"],["明星","Cxg明星-小小怪","82362122"],
  ["星神","Cxg星神-3zz","81686869"],["星神","Cxg星神-77","81815361"],["星神","Cxg星神-小温","82943492"],
  ["星神","Cxg星神-阿呆","81653691"],["星神","Cxg星神-菠萝粥","82233145"],["星神","Cxg星神-李嘉图","82165706"],
  ["星神","Cxg星神-湫","83019679"],["星神","Cxg星神-顺子","81403097"],["星神","Cxg星神-天一","81091772"],
  ["星神","Cxg星神-强仔","81718551"],["星神","Cxg星神-小月","82725371"],["星神","Cxg星神-Xuanz","81682335"],
  ["星神","Cxg星神-小夜","81659426"],["星神","Cxg星神-小蟹","81009877"],["星神","Cxg星神-李风","83136987"],
  ["星神","Cxg星神-小迹","83435268"],["星神","Cxg星神-对不起","83434854"],
  ["星尊","Cxg星尊-夏炎","80914156"],["星尊","Cxg星尊-小涵","82826779"],["星尊","Cxg星尊-秋秋","83020714"],
  ["星尊","Cxg星尊-小p","83503153"],["星尊","Cxg星尊-天气","81725238"],["星尊","Cxg星尊-小奇","80344606"],
  ["星尊","Cxg星尊-小也","83381803"],["星尊","Cxg星尊-白龙","83179124"],["星尊","Cxg星尊-兜哟","82062953"],
  ["星尊","Cxg星尊-小羽","81945242"],["星尊","Cxg星尊-山月","81591539"],["星尊","Cxg星尊-小布","83399719"],
  ["星尊","Cxg星尊-白","83489507"],["星尊","Cxg星尊-香蕉船","81564363"],["星尊","Cxg星尊-阿忠","81688420"],
  ["星尊","Cxg星尊-小六","82733258"],["星尊","Cxg星尊-老K","80188350"],["星尊","Cxg星尊-马红俊","83463229"],
  ["星尊","Cxg星尊-眠神","81004707"],["星尊","Cxg星尊-小浩","82501214"],["星尊","Cxg星尊-小旭","83381762"],
  ["星尊","Cxg星尊-小凯","82563326"],["星尊","Cxg星尊-小轩","83146253"],["星尊","Cxg星尊-烨臻","82705821"],
  ["星尊","Cxg星尊-齐天大圣","81271370"],["星尊","Cxg星尊-戒烟","83637018"],["星尊","Cxg星尊-老白金","81663285"],
  ["星尊","Cxg星尊-小五","82669902"],["星尊","Cxg星尊-超超","81492136"],["星尊","Cxg星尊-黑鲨","81798773"],
  ["星尊","Cxg星尊-小峰神","83275652"],["星尊","Cxg星尊-季雨","80217122"],["星尊","Cxg星尊-白菜","82850213"],
  ["星尊","Cxg星尊-人鱼牛","80342725"],["星尊","Cxg星尊-小锅","83461567"],["星尊","Cxg星尊-小烟","83020738"],
  ["星尊","Cxg星尊-唐三","83463244"],["星尊","Cxg星尊-季春","80486359"],["星尊","Cxg星尊-点心","80713105"],
  ["星尊","Cxg星尊-镜子","83409085"],["星尊","Cxg星尊-鱼","80863383"],["星尊","Cxg星尊-李乐平","83610337"],
  ["星尊","Cxg星尊-冰淇凌","83569901"],["星尊","Cxg星尊-uu","81771789"],["星尊","Cxg星尊-北子","80936295"],
  ["星尊","Cxg星尊-Epic","83646883"],["星尊","Cxg星尊-CYY","83724012"],["星尊","Cxg星尊-小皓","83394907"],
  ["星魁","Cxg星魁-Ee","81873530"],["星魁","Cxg星魁-小鑫","81871943"],["星魁","Cxg星魁-晚风","81891047"],
  ["星魁","Cxg星魁-阿路",""],["星魁","Cxg星魁-Bb","82644335"],
  ["颜值","Cxg颜值-壹纹","81609582"],["颜值","Cxg颜值-摆摆","83430067"],["颜值","Cxg颜值-阿狸","81684584"],
  ["颜值","Cxg颜值-漫漫","83570884"],["颜值","Cxg颜值-小佳","83570013"],["颜值","Cxg颜值-宋粢","81734975"],
  ["颜值","Cxg颜值-小艺TvT","82144856"],["颜值","Cxg颜值-冰冷歆","83365688"]
];

const STORAGE_KEY = "cxg_id_db_v1";
const CATS = ["明星","星神","星尊","颜值","星魁"];

/* ============ 数据层 ============ */
function loadDB(){
  let raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){ localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL)); return JSON.parse(JSON.stringify(INITIAL)); }
  try { return JSON.parse(raw); } catch(e){ return JSON.parse(JSON.stringify(INITIAL)); }
}
function saveDB(db){ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

let DB = loadDB();
// 默认进入第一个分类（不再有"全部"视图）
let currentCat = CATS[0];
let currentKeyword = "";

/* ============ DOM ============ */
const tbody = document.getElementById("tbody");
const countEl = document.getElementById("count");
const searchInput = document.getElementById("searchInput");

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getCatClass(c){ return "cat-" + c; }

/* ============ 渲染（仅当前分类） ============ */
function render(highlightName){
  let rows = DB.slice().filter(r => r[0] === currentCat);
  if(currentKeyword){
    const k = currentKeyword.toLowerCase();
    rows = rows.filter(r => r[1].toLowerCase().includes(k) || String(r[2]).includes(k));
  }
  // 分类计数徽标
  CATS.forEach(c => {
    const el = document.getElementById("num-" + c);
    if(el) el.textContent = DB.filter(r => r[0] === c).length || "";
  });
  countEl.textContent = `${currentCat} 共 ${rows.length} 条记录` + (currentKeyword ? `（搜索："${esc(currentKeyword)}"）` : "");
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="4" class="empty">暂无数据</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((r) => {
    const origIndex = DB.indexOf(r);
    const isNew = highlightName && r[1] === highlightName ? " badge-new" : "";
    return `<tr data-i="${origIndex}" class="${isNew}">
      <td><span class="cat-tag ${getCatClass(r[0])}">${r[0]}</span></td>
      <td>${esc(r[1])}</td>
      <td class="id-cell">${esc(String(r[2])) || '<span style="color:#bbb">无</span>'}</td>
      <td class="actions">
        <button class="btn btn-primary btn-sm" onclick="copyId('${esc(String(r[2]))}')">复制ID</button>
        <button class="btn btn-success btn-sm" onclick="startEdit(${origIndex})">修改</button>
        <button class="btn btn-danger btn-sm" onclick="delEntry(${origIndex})">删除</button>
      </td>
    </tr>`;
  }).join("");
}

/* ============ 搜索（输入变化实时响应，作用于当前分类） ============ */
function applyKeyword(kw){
  currentKeyword = kw;
  if(kw === ""){ searchInput.value = ""; }
  render();
}
function doSearch(){
  applyKeyword(searchInput.value.trim());
}
function clearSearch(){
  applyKeyword("");
  toast("已清除搜索");
}
searchInput.addEventListener("input", function(){ applyKeyword(this.value.trim()); });
searchInput.addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
document.getElementById("btnSearch").addEventListener("click", doSearch);
document.getElementById("btnClear").addEventListener("click", clearSearch);

/* ============ 分类标签（无"全部"，切换五个分类） ============ */
document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  currentCat = t.dataset.cat;
  currentKeyword = ""; searchInput.value = "";
  render();
});

/* ============ 添加（添加后自动归入对应分类表格） ============ */
document.getElementById("btnAdd").addEventListener("click", addEntry);
function addEntry(){
  const cat = document.getElementById("addCat").value;
  const name = document.getElementById("addName").value.trim();
  const id = document.getElementById("addId").value.trim();
  if(!name){ toast("请输入名称"); return; }
  if(DB.some(r => r[1] === name)){ toast("该名称已存在"); return; }
  DB.push([cat, name, id]);
  saveDB(DB);
  document.getElementById("addName").value = "";
  document.getElementById("addId").value = "";
  // 自动切换到该分类并刷新，新条目高亮
  switchCat(cat);
  render(name);
  toast("已添加（已切换到 " + cat + "）");
}

/* ============ 删除（行内确认，避免 confirm 阻塞/失效；三按钮始终同行） ============ */
function delEntry(i){
  const name = DB[i] ? DB[i][1] : "";
  if(!name) return;
  const tr = tbody.querySelector(`tr[data-i="${i}"]`);
  // 若已处于确认态，则执行删除
  if(tr && tr.classList.contains("confirm-del")){
    DB.splice(i, 1);
    saveDB(DB);
    render();
    toast("已删除");
    return;
  }
  // 否则进入确认态：在操作栏内追加确认提示，原三个按钮仍保留同行
  if(tr){
    tr.classList.add("confirm-del");
    let bar = tr.querySelector(".del-confirm");
    if(!bar){
      bar = document.createElement("span");
      bar.className = "del-confirm";
      bar.style.cssText = "margin-left:8px;display:inline-flex;align-items:center;gap:6px;color:#e74c3c;font-size:12px;";
      bar.innerHTML = `确定删除「${esc(name)}」吗？<button class="btn btn-danger btn-sm" onclick="delEntry(${i})">确认</button><button class="btn btn-sm" style="background:#95a5a6" onclick="cancelDel(${i})">取消</button>`;
      const td = tr.querySelector(".actions");
      if(td) td.appendChild(bar);
    }
  }
}
function cancelDel(i){ render(); }

/* ============ 修改（保存后自动归入对应分类表格） ============ */
function startEdit(i){
  const r = DB[i]; if(!r) return;
  tbody.querySelectorAll("tr.edit-row").forEach(tr => tr.classList.remove("edit-row"));
  const tr = tbody.querySelector(`tr[data-i="${i}"]`);
  if(!tr) return;
  tr.classList.add("edit-row");
  tr.innerHTML = `
    <td>
      <select>
        <option ${r[0]==="明星"?"selected":""}>明星</option>
        <option ${r[0]==="星神"?"selected":""}>星神</option>
        <option ${r[0]==="星尊"?"selected":""}>星尊</option>
        <option ${r[0]==="颜值"?"selected":""}>颜值</option>
        <option ${r[0]==="星魁"?"selected":""}>星魁</option>
      </select>
    </td>
    <td><input value="${esc(r[1])}"></td>
    <td><input value="${esc(String(r[2]))}"></td>
    <td class="actions">
      <button class="btn btn-success btn-sm" onclick="saveEdit(${i})">保存</button>
      <button class="btn btn-sm" style="background:#95a5a6" onclick="cancelEdit()">取消</button>
    </td>`;
  tr.querySelector("input").focus();
}
function saveEdit(i){
  const tr = tbody.querySelector("tr.edit-row"); if(!tr) return;
  const sel = tr.querySelectorAll("input");
  const cat = tr.querySelector("select").value;
  const name = sel[0].value.trim();
  const id = sel[1].value.trim();
  if(!name){ toast("名称不能为空"); return; }
  DB[i] = [cat, name, id];
  saveDB(DB);
  // 自动切换到修改后的分类并刷新，修改后的条目高亮
  switchCat(cat);
  render(name);
  toast("已更新（已切换到 " + cat + "）");
}
function cancelEdit(){ render(); }

/* 切换分类 Tab（程序化） */
function switchCat(cat){
  currentCat = cat;
  document.querySelectorAll(".tab").forEach(x => {
    x.classList.toggle("active", x.dataset.cat === cat);
  });
  currentKeyword = ""; searchInput.value = "";
}

/* ============ 复制 ============ */
function copyId(id){
  if(!id){ toast("该条目无 ID"); return; }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(id).then(() => toast("ID 已复制：" + id)).catch(() => fallbackCopy(id));
  } else { fallbackCopy(id); }
}
function fallbackCopy(id){
  const ta = document.createElement("textarea");
  ta.value = id; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("ID 已复制：" + id); } catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

/* ============ 提示 ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* 首次去重 */
(function dedupe(){
  const seen = new Set(); const uniq = [];
  for(const r of DB){ const k = r[1]; if(seen.has(k)) continue; seen.add(k); uniq.push(r); }
  if(uniq.length !== DB.length){ DB = uniq; saveDB(DB); }
})();

/* 初始化：默认激活第一个分类 Tab */
switchCat(CATS[0]);
render();
</script>
</body>
</html>
